name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/markill.zip
